name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: MAUI workload
        run: dotnet workload install maui-windows

      - name: Version
        id: version
        shell: pwsh
        run: |
          # Tags: the tag is the version. Other builds: VersionPrefix from Directory.Build.props + "-ci.N"
          # (never lower than the last release, which package validation would reject).
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else {
            $prefix = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
            $v = "$prefix-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # Build restores each project with its own properties (the MAUI sample needs its win-x64 runtime pack).
      - name: Build
        run: dotnet build Cartovia.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Cartovia.sln -c Release --no-build --logger trx --results-directory TestResults
        env:
          # Optional: enables the Mapbox GL JS end-to-end tests (they are skipped without a token).
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}

      - name: Pack
        run: dotnet pack Cartovia.sln -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write   # GitHub release
      packages: write   # GitHub Packages
      id-token: write   # nuget.org Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages: shown in the "Packages" section of the repository, no secret needed.
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --no-symbols --skip-duplicate

      # nuget.org Trusted Publishing: exchanges the GitHub OIDC token for a 1-hour API key (no stored secret).
      # Policy on nuget.org: owner nestebe, repository Cartovia, workflow ci.yml, environment nuget.
      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: nestebe   # nuget.org profile name

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
